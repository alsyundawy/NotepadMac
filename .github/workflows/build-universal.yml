name: Build Universal (DMG & ZIP)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Universal macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install Pillow

      - name: Generate Application Icon
        run: |
          python3 scripts/generate_app_icon.py

      - name: Build Universal App Bundle & ZIP
        run: |
          ./scripts/build-app.sh

      - name: Package Universal DMG Disk Image
        run: |
          ./scripts/build-dmg.sh

      - name: Run Test Suite
        run: |
          ./scripts/test-runner.sh

      - name: Verify Universal Mach-O Binary Architectures
        run: |
          lipo -info build/NotepadMac.app/Contents/MacOS/NotepadMac
          codesign --verify --deep --strict build/NotepadMac.app

      - name: Upload Universal Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NotepadMac-Universal-macOS
          path: |
            build/NotepadMac-*.zip
            build/NotepadMac-*.dmg
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/NotepadMac-*.zip
            build/NotepadMac-*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
