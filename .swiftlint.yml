allow_zero_lintable_files: true

included:
  - Sources
  - Tests
  - Package.swift

excluded:
  - .build
  - build
  - Sources/CLua
  - Sources/ScintillaCocoa
  - scripts

disabled_rules:
  - identifier_name
  - line_length
  - type_body_length
  - function_body_length
  - file_length
  - trailing_whitespace
  - multiple_closures_with_trailing_closure
  - cyclomatic_complexity
